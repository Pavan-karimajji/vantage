# Per-project x per-part toolchain/platform mapping for this component.
#
# adas-sim is no longer pure Python (WP-03, SWQ-01/DD-01): src/simcore is a
# real static-library target, sibling to the Python package (adas_sim,
# installed via pyproject.toml, unrelated to this file).
#
# package_type "static-library" puts conanfile.py's layout() into its
# output_folder-kind compiled-library branch, which defaulted to the
# src/platform/<comp>_sil/ shape df/vdy's SIL DLLs use -- a real mismatch
# against this module's actual tree (src/simcore/, include/simcore/, no
# src/platform/ at all). Closed 2026-08-19 (SM-02's own live throwaway-
# consumer verification): that branch now reads build_subdir/
# build_includedir from this file (defaulting to the old df/vdy path when
# absent, so every other component's build.yml is untouched) rather than
# hardcoding one tree shape -- the cross-submodule conanfile.py pass
# R-BUILD-6 requires, done once, byte-identical across all 9 repos.
build_subdir: src/simcore
build_includedir: include

# WP-33/SS13.3a restructure (done): vantage is a build target of THIS
# component's own build entry point, never a separate one -- `python
# build.py -t/-p/-P` (or build.bat/build.sh) here also builds
# modules/sim/vantage/, with no separate command, no bootstrap stub and no
# conf/build_tools.version pin of its own (adas_build_tools.cli reads this
# key generically -- it never learns the name "vantage").
#
# vantage stays a genuinely distinct Conan package (its own conanfile.py +
# conf/build.yml one level down) purely because adas-viz already requires
# adas-sim unconditionally (its player component's AdasSim::io edge,
# VZ-12/D-10) -- a package-level requires the other way, from THIS
# component onto adas-viz, is a real Conan graph cycle, verified live via
# `conan graph info`. CMakeDeps' build_context_activated/tool_requires
# mechanism (already used two lines below for protobuf/protoc) was tried
# as an escape and rejected: it resolves without a cycle error, but
# generates only empty-LIBS interface stubs for a build-context library --
# unusable for actually linking vantage_app against the real, compiled
# adas-viz toolkit/player/host/runner components. Every entry here is
# skipped, never failed, for a target/platform vantage's own conf/build.yml
# does not declare (e.g. this component's ubuntu_gcc build correctly skips
# vantage, which is vs2026-only).
subcomponents: [vantage]

recipe:
  type: static-library
  libs: [simcore]
  # SM-06, found live publishing this pass: once `components:` exists,
  # Conan's package_info() validates every direct requires() is referenced
  # by SOME cpp_info/component's own `.requires` -- `io`'s below covers
  # mcap/protobuf, but the unnamed root (which owns everything else, i.e.
  # transport) declares no `.requires` at all unless told to (`root_requires`
  # unset previously relied on CMakeDeps' own separate auto-link-all
  # generation, which is not what this validator checks). Made explicit
  # here rather than adding `adas-interfaces` to `io`'s own list (which
  # would be architecturally wrong -- D-5 is explicit that `io` alone stays
  # linkable without the engine, transport is not). Same VIZ_Sync_Plan.md
  # `ANL-VZ-05` shape mcap already hit for `adas-viz`'s own `player`
  # component (2026-08-20), one level up (unnamed root here, not a
  # component) because this recipe's root, unlike viz's, has no libs of its
  # own component list to attach it to instead.
  root_requires: [mcap::mcap, protobuf::libprotobuf, adas-interfaces::adas-interfaces]
  # SM-02 (VIZ_Sync_Plan_v0.1.md, "D-10's only cost"): `io` is separately
  # linkable as the Conan component `adas-sim::io`, so a consumer (the viz
  # player) can read a recording without acquiring the engine. Same
  # `simcore` static library as the top-level package today -- `io/*.cpp`
  # is not yet split into its own CMake target (src/simcore/CMakeLists.txt
  # builds one `simcore.a`), so this component is a named subset VIEW over
  # the one artifact, not a second binary. `io`'s own component below keeps
  # requiring nothing first-party -- unaffected by SM-06's new
  # `adas-interfaces` requires: below (a named component gets NOTHING
  # implicitly from a package's requires(), SM-02's own live verification).
  # The escape hatch, should `io` itself ever need a first-party dep, is
  # still a new Conan package for `io`, never a bigger component list here.
  components:
    io:
      libs: [simcore]
      # SM-02's own live verification (2026-08-19): Conan does not implicitly
      # propagate a package's requires() to a NAMED component the way it does
      # to the unnamed root cpp_info -- a consumer linking only `adas-sim::io`
      # linked no mcap/lz4/zstd symbols at all without this, real
      # `LZ4F_*`/`ZSTD_*` unresolved externals from mcap.cpp. Same target
      # `simcore PUBLIC mcap::mcap` already names in CMakeLists.txt.
      # `protobuf::libprotobuf` added for `SM-05a` (the `.erg` codec):
      # DescriptorPool/DynamicMessageFactory reflection to reconstruct real
      # port messages from a manifest's own descriptor_set bytes (R-SIM-11)
      # -- third-party, like mcap.
      # `adas-interfaces::adas-interfaces` added WP-33 (SM-11), found live:
      # `io`'s own public header (`simcore/transport.hpp`, part of `libs:
      # [simcore]` above) `#include`s modules/interfaces' `transport/
      # ITransport.hpp` (R-IFACE-1) -- a real, pre-existing first-party
      # header need this component's own comment (below, now stale) assumed
      # away. Never surfaced before this pass: every existing consumer of
      # `AdasSim::io` reached AdasInterfaces' headers some OTHER way in the
      # same build (sim's own in-tree simcore target, or viz's own
      # `player` component separately declaring it) -- `vantage` is the
      # first consumer linking bare `AdasSim::io` with nothing else
      # supplying that header path.
      requires: [mcap::mcap, protobuf::libprotobuf, adas-interfaces::adas-interfaces]

variants:
  base:
    requires:
      # WP-06 (SI-01, DD-13): the one codec io/ registers -- the same
      # conancenter mcap/1.2.0 sil_host already vendors for its own
      # RecordingReader (reused, not a second pinned version).
      - mcap/1.2.0
      # SM-05a: the `.erg` codec's reflection engine -- same conancenter
      # protobuf/3.21.12 pin every other component in this repo already
      # uses (never a second pinned version).
      - protobuf/3.21.12
      # SM-06 (SI-25, D-5): the player<->engine `Transport` wire/ABI
      # contract -- both ends require it (R-IFACE-1), this is the engine
      # end. First-party, unlike every other entry above -- covered by the
      # explicit `root_requires:` above (recipe.root_requires), not `io`'s
      # own named component's `requires:`, so `io` still requires nothing
      # first-party (this file's own comment on that component, unchanged).
      - adas-interfaces/1.0.0
    sil:
      platforms: &base_platforms
        - build: vs2026
        # WP-17/LO-01 (toolchain's imp_design.md section 12): adas-viz's
        # own real ubuntu_gcc build needs this component green there --
        # never declared before this session, on any target. Without it,
        # AdasComponent.layout()'s own _editable_platform() shortcut
        # ("exactly one declared platform -> return it unconditionally")
        # returned "vs2026" even on a genuine ubuntu_gcc build, silently
        # pointing every consumer (viz) at the wrong build-sil-<platform>/
        # directory regardless of the {build_type} fix in layout() itself
        # -- found live, the real reason "Library 'simcore' not found"
        # persisted even after adas-sim was correctly built under
        # ubuntu_gcc. Same one-line addition mathlib/df each needed for
        # their own ubuntu_gcc bring-up (see mathlib's own conf/build.yml).
        - build: ubuntu_gcc
    # WP-06: UT-IO-* need a real test binary -- modules/sim had none before
    # this stage (WP-03's own scoping note: "no gtest target, no C++ tests
    # exist yet"). Same list, aliased -- not a second, independently
    # maintained copy (sil_host's own gtest: does this identically).
    gtest:
      platforms: *base_platforms
    # VZ-11 (v1 freeze): adas-viz/1.0.0's own `player` component now
    # requires adas-sim/0.1.0 for real (VZ-12/D-10) -- found live
    # (2026-08-19) attempting `conan create` for adas-viz: `adas-sim/0.1.0`
    # was never resolvable from any remote because this component had no
    # `package:` variant to build/upload one with (`adas-interfaces`/
    # `adas-mathlib`/`adas-shared-config` all have one; this one never
    # needed it before a consumer outside this checkout existed). Same
    # `-t package --upload` path every other component uses.
    package:
      platforms: *base_platforms
