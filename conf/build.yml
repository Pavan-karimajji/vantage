# Per-project x per-part toolchain/platform mapping for this component.
#
# adas-sim is no longer pure Python (WP-03, SWQ-01/DD-01): src/simcore is a
# real static-library target, sibling to the Python package (adas_sim,
# installed via pyproject.toml, unrelated to this file).
#
# package_type "static-library" puts conanfile.py's layout() into its
# output_folder-kind compiled-library branch, which defaulted to the
# src/platform/<comp>_sil/ shape df/vdy's SIL DLLs use -- a real mismatch
# against this module's actual tree (src/simcore/, include/simcore/, no
# src/platform/ at all). Closed 2026-08-19 (SM-02's own live throwaway-
# consumer verification): that branch now reads build_subdir/
# build_includedir from this file (defaulting to the old df/vdy path when
# absent, so every other component's build.yml is untouched) rather than
# hardcoding one tree shape -- the cross-submodule conanfile.py pass
# R-BUILD-6 requires, done once, byte-identical across all 9 repos.
build_subdir: src/simcore
build_includedir: include

recipe:
  type: static-library
  libs: [simcore]
  # SM-02 (VIZ_Sync_Plan_v0.1.md, "D-10's only cost"): `io` is separately
  # linkable as the Conan component `adas-sim::io`, so a consumer (the viz
  # player) can read a recording without acquiring the engine. Same
  # `simcore` static library as the top-level package today -- `io/*.cpp`
  # is not yet split into its own CMake target (src/simcore/CMakeLists.txt
  # builds one `simcore.a`), so this component is a named subset VIEW over
  # the one artifact, not a second binary. Safe while `simcore` requires
  # nothing first-party (checked live, `requires:` below is `mcap` only,
  # third-party) -- the escape hatch, should that stop being true, is a new
  # Conan package for `io`, never a bigger component list here.
  components:
    io:
      libs: [simcore]
      # SM-02's own live verification (2026-08-19): Conan does not implicitly
      # propagate a package's requires() to a NAMED component the way it does
      # to the unnamed root cpp_info -- a consumer linking only `adas-sim::io`
      # linked no mcap/lz4/zstd symbols at all without this, real
      # `LZ4F_*`/`ZSTD_*` unresolved externals from mcap.cpp. Same target
      # `simcore PUBLIC mcap::mcap` already names in CMakeLists.txt.
      requires: [mcap::mcap]

variants:
  base:
    requires:
      # WP-06 (SI-01, DD-13): the one codec io/ registers -- the same
      # conancenter mcap/1.2.0 sil_host already vendors for its own
      # RecordingReader (reused, not a second pinned version).
      - mcap/1.2.0
    sil:
      platforms: &base_platforms
        - build: vs2026
    # WP-06: UT-IO-* need a real test binary -- modules/sim had none before
    # this stage (WP-03's own scoping note: "no gtest target, no C++ tests
    # exist yet"). Same list, aliased -- not a second, independently
    # maintained copy (sil_host's own gtest: does this identically).
    gtest:
      platforms: *base_platforms
    # VZ-11 (v1 freeze): adas-viz/1.0.0's own `player` component now
    # requires adas-sim/0.1.0 for real (VZ-12/D-10) -- found live
    # (2026-08-19) attempting `conan create` for adas-viz: `adas-sim/0.1.0`
    # was never resolvable from any remote because this component had no
    # `package:` variant to build/upload one with (`adas-interfaces`/
    # `adas-mathlib`/`adas-shared-config` all have one; this one never
    # needed it before a consumer outside this checkout existed). Same
    # `-t package --upload` path every other component uses.
    package:
      platforms: *base_platforms
