# CARLA blueprint id -> a classification TOKEN (`S-C2` slice 5). The token
# is a plain string, resolved to the real enum value by whichever
# component's generated bindings the caller supplies (this module carries
# no generated proto of its own, R-SIM-11) -- verbatim against
# PerceptionCore__Outputs/gen_object.proto's `DetectedObject.Classification`
# names: CAR, TRUCK, PEDESTRIAN, MOTORCYCLE, BICYCLE, WIDE, UNCLASSIFIED,
# OTHER_VEHICLE, TL, MULTIPLE, POINT.
#
# A scenario's own explicit `classification:` on an actor always wins; this
# catalogue is only the fallback when a scenario spawns a blueprint without
# declaring one. NOT verified against a real CARLA blueprint library
# (`R-IFACE-3`'s "unverified" provenance discipline extended here) -- a
# starting point from CARLA's documented default content, to be corrected
# once checked against a live server's `world.get_blueprint_library()`.

prefixes:
  "walker.pedestrian.": PEDESTRIAN
  "vehicle.diamondback.": BICYCLE
  "vehicle.gazelle.": BICYCLE
  "vehicle.bh.crossbike": BICYCLE
  "vehicle.harley-davidson.": MOTORCYCLE
  "vehicle.kawasaki.": MOTORCYCLE
  "vehicle.yamaha.": MOTORCYCLE
  "vehicle.vespa.": MOTORCYCLE
  "vehicle.carlamotors.": TRUCK
  "vehicle.tesla.cybertruck": TRUCK
  "vehicle.": CAR

default: UNCLASSIFIED
