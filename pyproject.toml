[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adas-sim"
version = "0.1.0"
description = "Simulation & visualization framework (Vantage) - component-agnostic, drives SIL libraries against live or recorded stimuli."
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",
    "protobuf>=4.25",
    "mcap>=1.0",
    "mcap-protobuf-support>=0.5",
    "numpy>=1.26",
    # WP-04: schema.py's published JSON-Schema set (IMP-0151/0152) and
    # roundtrip.py's comment/key-order/quoting-preserving loader (IMP-0155) --
    # pyyaml's SafeLoader/safe_dump cannot round-trip either.
    "jsonschema>=4.20",
    "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
figures = ["matplotlib>=3.8"]
video = ["imageio[ffmpeg]>=2.34"]
foxglove = ["foxglove-sdk>=0.25"]
dev = ["pytest>=8", "pytest-cov", "pandas>=2"]
# S-D5: the one-folder frozen build's own build-time tool -- never a
# runtime dependency of adas_sim itself, so it stays out of `dependencies`
# and out of every other extra (a frozen build cannot bundle its own
# freezer).
package = ["pyinstaller>=6"]

[project.scripts]
# The launcher is generated per platform by the installer, not written by us
# (sim_portability.md P-6).
sim = "adas_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["adas_sim*"]

[tool.setuptools.package-data]
# WP-04/WP-05, IF-13: the published JSON-Schema set ships in the package
# itself, not read from a source checkout (R-SIM-11).
adas_sim = ["config/schemas/*.schema.json", "runspec/schema/*.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
