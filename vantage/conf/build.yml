# Per-project x per-part toolchain/platform mapping for this component
# (docs/project_variant_model.md). Same shape as modules/mathlib's/modules/
# viz's own conf/build.yml: a plain static library, cmake_layout, headers
# under cpp/.
#
# WP-33 (SM-11, O-7): a SECOND, independent Conan package living inside the
# modules/sim git repo -- not modules/sim itself. `vantage` needs both
# `adas-sim` and `adas-viz`, and `adas-viz` already requires `adas-sim`
# unconditionally (its own `player` component's `AdasSim::io` edge) -- giving
# `adas-sim` ITSELF a reverse `requires: adas-viz` is a real Conan graph
# cycle (`conan graph info`: "There is a cycle/loop in the graph", found
# live -- modules/sim/docs/v2/SIM_Implementation_Plan_v0.1.md's own `WP-33`
# row has the full account, including two other approaches tried and ruled
# out for equally real reasons). A package that depends on both, with
# neither depending back on it, is an ordinary diamond -- exactly how `df`
# already depends on `adas-viz` (which depends on `adas-sim`) with no cycle.
# This is a deliberate, explicit deviation from R-GIT-1's "one repo per
# component" convention, approved for exactly this reason: `modules/sim/
# vantage/` is versioned inside the sim repo but is its own Conan package,
# `adas-vantage`, entirely independent of `adas-sim`'s own conf/build.yml/
# conanfile.py (this file, byte-identical `conanfile.py`/`build.bat`/
# `scripts/build.py` copies included).
layout_kind: cmake_layout

recipe:
  type: static-library
  libs: [vantage_bridge]

variants:
  base:
    requires:
      - adas-sim/0.1.0
      - adas-viz/1.0.0
    sil:
      platforms: &base_platforms
        - build: vs2026
    gtest:
      platforms: *base_platforms
    package:
      platforms: *base_platforms
