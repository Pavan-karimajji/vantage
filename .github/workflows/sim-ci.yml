# S-C0 -- the automatic gate (docs/sim_implementation_plan.md). `ST-C0-1`: this
# job runs green on the current tree, with `ci_gate_config.yaml`'s pytest_floor
# equal to the number actually observed the day it was set -- no aspirational
# floor.
#
# Thin wrapper only: every real check lives in scripts/ci_gate.py, which is
# invoked identically here and by hand, so this file owns triggers and
# artifact retention and nothing else (S-C0's "Must not" -- no general CI
# design here, that is plan.md item 20).
#
# Known flake tolerated by scripts/ci_gate_config.yaml, listed here too so a
# reader of this job never has to go find it:
#   tests/system/test_b3_viewport_controls.py::
#     test_dragging_pans_the_viewport_and_a_second_click_still_selects
#   -- order/fixture-isolation dependent, owner S-B3 follow-up
#   (sim_implementation_plan.md Phase C risk table). Not deselected -- it
#   still runs; ci_gate.py tolerates that one id by name and reports it.
#
# S-C6: ci_gate.py's "full" mode now also runs `sim check` over df's real
# scenario set (modules/df/tests/carla_scenarios) -- still nothing to edit
# here, it lives inside ci_gate.py's own main(). On THIS job's runner
# (ubuntu-latest, no C++ toolchain) it always reports "skipped -- no df_sil
# build found", by design (S-C6's own "Must not: grow into a general CI
# design" -- adding the toolchain job that makes this a real check is
# plan.md item 20's scope, not this stage's).
#
# IMP-0366 / ANL-SW-70 (docs/v2/SIM_Implementation_Plan_v0.1.md WP-01,
# CN-0351): the suite runs on Windows and Linux, not Linux alone --
# `gate-windows` mirrors `gate` exactly, `shell: bash` on both so the one
# script is never forked into two maintained copies (R-STYLE-2). "Compares
# results" (WP-01's Exit gate 2) means what it means for every other
# required check in this workflow: both must independently pass for the
# job to be green, so a platform-specific regression is caught at the
# platform it broke on, not averaged away by the other one passing.

name: sim-ci

# Trigger corrected 2026-08-27. This read `branches: [feat/sim-platform]`, and
# that branch is 98 commits behind `main` with nothing `main` lacks -- abandoned.
# So the job existed from 2026-08-13 and could never once have fired, which is
# the mechanical reason the repository had no CI while `WP-01` reported 16/18
# done. It is the same failure this package's own Exit gate names -- a green
# check that scanned nothing is indistinguishable from a green check that
# scanned everything -- arriving one level up, at the trigger rather than the
# check. `main` is where the work lands (R-GIT-1: submodule first, pointer
# after), so `main` is what the gate must watch.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  gate:
    name: gate (full deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (core + dev + viewer + figures)
        run: python -m pip install -e ".[dev,viewer,figures]"

      - name: Resolve docs-only skip decision
        id: since
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "ref=" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$BEFORE" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the gate
        run: |
          if [ -n "${{ steps.since.outputs.ref }}" ]; then
            python scripts/ci_gate.py --since "${{ steps.since.outputs.ref }}" --artifact-dir logs/ci_gate/run
          else
            python scripts/ci_gate.py --artifact-dir logs/ci_gate/run
          fi

      - name: Retain artefacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sim-ci-gate-${{ github.run_id }}
          path: logs/ci_gate/run
          retention-days: 14

  gate-windows:
    name: gate (full deps, Windows -- IMP-0366)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (core + dev + viewer + figures)
        shell: bash
        run: python -m pip install -e ".[dev,viewer,figures]"

      - name: Resolve docs-only skip decision
        id: since
        shell: bash
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "ref=" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$BEFORE" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the gate
        shell: bash
        run: |
          if [ -n "${{ steps.since.outputs.ref }}" ]; then
            python scripts/ci_gate.py --since "${{ steps.since.outputs.ref }}" --artifact-dir logs/ci_gate/run
          else
            python scripts/ci_gate.py --artifact-dir logs/ci_gate/run
          fi

      - name: Retain artefacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sim-ci-gate-windows-${{ github.run_id }}
          path: logs/ci_gate/run
          retention-days: 14

  core-only-smoke:
    name: core-only smoke (no Qt/matplotlib/foxglove -- P-10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (core + dev only, no extras)
        run: python -m pip install -e ".[dev]"

      - name: Suite must still pass with the extras split real -- Qt/matplotlib/foxglove tests skip, nothing else does
        run: python -m pytest tests -q
