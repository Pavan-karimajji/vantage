# VNT requirement set — Vantage (Plan C).
#
# Driven by .claude/templates/requirements/trace_check.py --set <this dir>.
# Layers SYS + IMP by program decision (VANTAGE_DEV_PLAN.md D5). IMP rows serve
# SYS directly: SYS is the layer above, so no skip is declared.
# Written in parts (VANTAGE_DEV_PLAN.md §6, step 8): 8a the orchestrator (C1),
# 8b the live measurement writer, inspector and supervisor (C2), 8c the launcher,
# window, scenario script, batch, configuration, diagnostics and delivery.

module: VNT
component: VANTAGE

layers:
  - id: SYS
    name: System
    doc: VANTAGE_System_Requirements.md
    tests: [SYT, ANL]
    budget: 120
    requires_binds: true
  - id: IMP
    name: Implementation Design
    doc: VANTAGE_Implementation_Design.md
    tests: []                 # verified by the tests of the SYS rows it serves
    budget: 120
    row_style: table          # | Box | UID | Serves | WP | Change | Artifact - Design | Tests |

test_spec: VANTAGE_Test_Spec.md

# R-REQ-6a. The build order lives in the same file as the IMP rows.
plan: VANTAGE_Implementation_Design.md

# R-REQ-13. The parts of VANTAGE_Architecture.md §3 (launcher, orchestrator,
# runner, sample buffers, live measurement writer, inspector, supervisor,
# engines) x 30 = 240 = 120 (SYS) + 120 (IMP).
budget_basis:
  unit: architecture_part
  count: 8
  per_unit: 30
  total: 240

budget_history:
  - date: 2026-10-31
    change: "first declaration: 8 parts x 30 = 240; SYS 120, IMP 120"
    why: >-
      Part 8a states three of the eight parts (orchestrator, runner, sample
      buffers) in 45 SYS and 48 IMP rows, about 30 rows per part. The
      expectation assumes the other five parts are of the same size; 8b and 8c
      check it against what they write.
  - date: 2026-11-03
    change: "no change to the basis; IMP is 124 against 120, SYS is 105 against 120"
    why: >-
      Part 8b states three more parts (live measurement writer, inspector,
      supervisor) in 48 SYS and 54 IMP rows, about 16 SYS and 18 IMP per part,
      against 15 and 15 expected; with 8a the six parts hold 105 SYS and 124 IMP.
      The IMP layer is over because the inspector's five checks and the
      supervisor's separate reproducer, manifest, seal and supervision-cell symbols are one
      artifact per row (R-REQ-3), and because the transport publisher's
      retirement is three rows. Nothing was compressed to fit. Part 8c, two
      parts, has 15 SYS and none left for IMP under this basis: it is the one to
      check against it.
  - date: 2026-11-04
    change: "no change to the basis; IMP is 222 against 120, SYS is 199 against 120"
    why: >-
      Part 8c states the last two parts (the launcher with its window and the scenario script; batch, configuration,
      diagnostics, delivery and determinism) and disposes the Python run path, in 94 SYS and 98 IMP rows, about
      47 SYS and 49 IMP per part against 15 and 15 expected; the whole set holds 199 SYS and 222 IMP. The basis
      was too small for these parts, not the rows too many: the register carries 769 sim rows that stay with Vantage, which
      94 system rows now state, and each implementation row names one file and its symbols (R-REQ-3). 16 of the IMP
      rows are a DROP of a retired path and 10 are a test file, one per area. Nothing was compressed to fit and no
      obligation was invented to place a register row; the rows no SYS row states are listed in the report of part 8c
      with a recommendation each.

limits:
  requirement_words: 60
  headline_chars: 90
  commentary_lines_per_requirement: 6

context:
  - kind: architecture
    doc: VANTAGE_Architecture.md
  - kind: register
    doc: VANTAGE_Migration_Register.md
  - kind: architecture
    doc: VANTAGE_Lab_Design.md
    rollup: true

# R-REQ-15. Vantage is not a component: it has no conf/ports.yaml. Its boundary
# is the run setup and the recording it reads, the stages it runs, and what it
# writes. All are PROPOSED.
ports:
  source: ../conf/ports.yaml
  proposed:
    inputs:
      - name: runSetup
        proto_type: the run setup, a JSON file (VANTAGE_Architecture.md §2.3)
      - name: recording
        proto_type: the one recording an engine run reads, in one or more files
      - name: stageOut
        proto_type: what a simulated stage publishes in a run (data outputs, refSync, compState)
    outputs:
      - name: control
        proto_type: adas.common.CycleControl, written for each run of a simulated stage
      - name: stageIn
        proto_type: the input samples handed to a simulated stage in one run
      - name: runRecording
        proto_type: the recording the engine run writes (outputs.path)
      - name: stepRecord
        proto_type: per engine step, what the engine hands the live measurement writer (step, time, values, badges)
      - name: eventLog
        proto_type: the engine's event log lines
      - name: plan
        proto_type: the printed plan of ranks, triggers and clocks
      - name: exitStatus
        proto_type: the engine's exit code and its error message
      - name: liveMeas
        proto_type: the live measurement (adas.livemeas - MeasStatus, MeasDescription, the MeasCycle ring, the MeasBulk ring)
      - name: inspectorReport
        proto_type: what vantage-inspect prints and its exit code (ARCH §10.3)
      - name: attemptManifest
        proto_type: the supervisor's record of each attempt (ARCH §3.7)
      - name: reproducer
        proto_type: the package the supervisor writes after a crash (ARCH §3.7)
      - name: launcherChoice
        proto_type: what the developer chooses in the launcher - recording, project, each stage's mode and implementation, overrides, triggers
      - name: commandLine
        proto_type: the command line that starts an engine run, as built, printed or copied
      - name: scenarioFile
        proto_type: a scenario file of explicit values (message type, time, header counters, field values)
      - name: batchReport
        proto_type: the batch's status list, totals per exit code and per-entry directories
      - name: configBundle
        proto_type: a stage's bundle folder beside its library, with bundle.sha256
      - name: doctorReport
        proto_type: what sim doctor prints about the environment
      - name: compareReport
        proto_type: what sim determinism prints for two runs - the axis, the differences, the tolerance in force
      - name: deliveredPackage
        proto_type: the installed files of adas-vantage and its version file
