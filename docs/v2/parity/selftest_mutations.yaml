# Planted violations for `trace_check.py --selftest` (R-REQ-9).
#
# Declared here, beside layers.yaml, never inside trace_check.py -- the checker
# carries no module's document names, which is what makes "copy it to any
# module" true. Each entry makes one edit to a throwaway copy of this directory
# and asserts the named check catches it.
#
# A check nobody has seen fail is a check nobody should believe.
#
# Two checks are deliberately NOT planted here, because this set cannot express
# them and a plant that can never fire is worse than none:
#   C-BINDS            SYS declares requires_item, not requires_binds -- sim is
#                      not a component and has no conf/ports.yaml (R-REQ-15).
#                      C-ITEM below is the check that applies instead.
#   C-KPI-UNMEASURED   STK declares [feature] alone -- the bench is a tool, not
#                      a vehicle feature, so it has no KPI row to break.
# Both are planted in .claude/templates/requirements/example, which declares
# them, so neither check is unproven anywhere.

mutations:
  - expect: C-DANGLING
    file: PARITY_System_Requirements.md
    why: a trace to a UID that does not exist
    find: |-
      **Verify.** T · `SYT-ING-01`   **Trace.** `STK-0001`
    replace: |-
      **Verify.** T · `SYT-ING-01`   **Trace.** `STK-9999`

  - expect: C-TWOWAY
    file: PARITY_Test_Spec.md
    why: the two halves of a link disagreeing
    find: |-
      **Serves.** `SYS-0022`
    replace: |-
      **Serves.** `SYS-0023`

  - expect: C-STATUS
    file: PARITY_Stakeholder_Requirements.md
    why: a Status field smuggled into a specification
    find: |-
      **Shall.** The bench shall feed a port from a recording
    replace: |-
      **Status.** frozen
      **Shall.** The bench shall feed a port from a recording

  - expect: C-ITEM
    file: PARITY_System_Requirements.md
    why: a surface invented at the point of use instead of declared
    find: |-
      **Item.** `diag`
    replace: |-
      **Item.** `not_a_surface`

  - expect: C-HEADLINE
    file: PARITY_System_Requirements.md
    why: a headline over the character cap
    find: |-
      — The chosen cycle is identified
    replace: |-
      — The chosen cycle is identified, and also a great deal more is said here than any headline has business saying

  - expect: C-WORDS
    file: PARITY_System_Requirements.md
    why: Shall plus Accept over the word cap, which means more than one obligation
    find: |-
      **Shall.** A set of recordings shall be selectable by classification alone.
    replace: |-
      **Shall.** A set of recordings shall be selectable by classification alone, and shall also be selectable by author, and by duration, and by the vehicle that produced them, and by the weather at the time, and by whether anyone has looked at them before, and by every other field the recording happens to carry anywhere in its manifest.

  - expect: C-ORPHAN
    file: PARITY_System_Requirements.md
    why: a requirement with no test -- unverifiable as written
    find: |-
      **Verify.** T · `SYT-DIA-01`   **Trace.** `STK-0007`
    replace: |-
      **Trace.** `STK-0007`

  - expect: C-NOPLANT
    file: PARITY_Test_Spec.md
    why: an A-method check with no planted-violation case
    find: |-
      - `.c2` **PASS:** the planted violation is reported
    replace: |-
      - `.cX` **PASS:** the planted violation is reported

  - expect: C-CATEGORY
    file: PARITY_Stakeholder_Requirements.md
    why: a category the module does not declare
    find: |-
      **Category.** `feature`
      **Verify.** T · `STT-02`
    replace: |-
      **Category.** `kpi`
      **Verify.** T · `STT-02`

  - expect: C-CATEGORY-EMPTY
    file: layers.yaml
    why: a category declared but populated by nothing
    find: |-
        categories: [feature]
    replace: |-
        categories: [feature, kpi]

  - expect: C-FIXTURE
    file: PARITY_Test_Spec.md
    why: a fixture cited but absent from the catalogue
    find: |-
      **`SYT-PLY-02`** · T · fixture `F-PLAY`
    replace: |-
      **`SYT-PLY-02`** · T · fixture `F-NOT-CATALOGUED`

  - expect: C-TESTLAYER
    file: PARITY_Test_Spec.md
    why: a stakeholder test serving a system requirement
    find: |-
      **`STT-07`** · T · fixture `F-FLOOD` — The log survives a repeating message
      **Serves.** `STK-0007`
    replace: |-
      **`STT-07`** · T · fixture `F-FLOOD` — The log survives a repeating message
      **Serves.** `SYS-0024`

  - expect: C-UNDECOMP
    file: PARITY_System_Requirements.md
    why: >-
      a stakeholder requirement nothing below decomposes. STK-0004 has exactly
      one child, so re-pointing it leaves that row unparented from beneath --
      the shape a layer written half-way always has.
    find: |-
      **Verify.** T · `SYT-LNC-01`   **Trace.** `STK-0004`
    replace: |-
      **Verify.** T · `SYT-LNC-01`   **Trace.** `STK-0001`

  - expect: C-LAYER-EMPTY
    file: layers.yaml
    why: >-
      a layer declared but never populated -- you said you would write it and
      did not. Planted by pointing the layer at a document that exists but
      holds no requirements: a requirement UID is four digits and a test id
      two, so the test spec parses as zero requirements for this layer.
    find: |-
      doc: PARITY_System_Requirements.md
    replace: |-
      doc: PARITY_Test_Spec.md

  - expect: C-COMMENTARY
    file: PARITY_Stakeholder_Requirements.md
    why: >-
