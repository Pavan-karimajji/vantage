      ## Anatomy

  # C-UNLANDED is NOT planted here, and the selftest is what said so.
  #
  # The check reads the LOWEST declared layer. That was SYS; declaring the SW
  # layer on 2026-09-05 moved it to SW, which is empty until Stage 4 -- so
  # removing a `lands SYS-xxxx` entry from the plan stopped meaning anything
  # and the plant went blind. Deleted rather than left red: a plant that cannot
  # fire reads as coverage and is worse than none (R-REQ-9).
  #
  # RETURNS AT STAGE 6, once SW rows exist and the plan lands them. The other
  # three plan checks below still fire and are unaffected.

  - expect: C-DUPLAND
    file: PARITY_Implementation_Plan.md
    why: one requirement landed by two packages -- two places to build one thing
    find: |-
      lands `SYS-0022`, `SYS-0023`
    replace: |-
      lands `SYS-0022`, `SYS-0023`, `SYS-0020`

  - expect: C-PLANUID
    file: PARITY_Implementation_Plan.md
    why: a package landing a UID that does not exist
    find: |-
      lands `SYS-0013`, `SYS-0014`
    replace: |-
      lands `SYS-0013`, `SYS-9999`

  - expect: C-PLANMARK
    file: PARITY_Implementation_Plan.md
    why: >-
      a row marked started with no resume condition. R-REQ-6a allows `[~]` only
      when it says `closed by <command or condition>` -- its whole value is
      telling the next session where to pick up.
    find: |-
      - [ ] **WP-05**
    replace: |-
      - [~] **WP-05**
